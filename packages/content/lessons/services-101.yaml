id: services-101
unit: services
title: Services
xp: 10
order: 1
strict: true
prereqs: []
theory: ./services-101.md
scenario:
  nodes:
    - name: node-1
      cpu: "4"
      memory: 8Gi
  objects: []
objectives:
  - ClusterIP
  - Service discovery
checks:
  - type: command
    label: Created the backing Deployment
    verb: create
    resource: deployments
    name: web
    image: nginx
    replicas: 2
  - type: deployment
    label: Deployment has two replicas
    namespace: default
    name: web
    replicas: 2
    image: nginx
    ready: true
    labels:
      app: web
  - type: command
    label: Exposed the Deployment
    verb: expose
    resource: deployments
    name: web
  - type: service
    label: ClusterIP Service exists
    namespace: default
    name: web
    serviceType: ClusterIP
    port: 80
  - type: quiz
    id: q1
    label: ClusterIP
    question: Which Service type gives a stable cluster-internal IP?
    options:
      - ClusterIP
      - NodePort
      - LoadBalancer
    answer: 0
  - type: quiz
    id: q2
    label: Service discovery
    question: How does a Service find its Pods?
    options:
      - Label selector
      - Pod name
      - Hard-coded IPs
    answer: 0
hints:
  - "Create the backing workload: kubectl create deployment web --image=nginx --replicas=2"
  - "Expose it with: kubectl expose deployment web --port=80"
  - "Inspect the result with: kubectl get services"
  - "Then inspect endpoints with: kubectl get endpoints web"
solution: ClusterIP gives the Deployment a stable internal Service and Endpoints.
