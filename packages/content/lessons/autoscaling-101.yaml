id: autoscaling-101
unit: scheduling
title: Horizontal autoscaling
xp: 10
order: 2
strict: true
prereqs: []
theory: ./autoscaling-101.md
scenario:
  nodes:
    - name: node-1
      cpu: "4"
      memory: 8Gi
  objects:
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: web
      spec:
        replicas: 3
        template:
          labels:
            app: web
          containers:
            - name: nginx
              image: nginx
              resources:
                requests:
                  cpu: 100m
      status:
        replicas: 3
        readyReplicas: 3
        updatedReplicas: 3
        availableReplicas: 3
    - apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: web
      spec:
        minReplicas: 2
        maxReplicas: 8
        scaleTargetRef:
          kind: Deployment
          name: web
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 50
      status:
        currentReplicas: 3
        desiredReplicas: 5
        currentCPUUtilization: 80
objectives:
  - HPA
checks:
  - type: command
    label: Listed the HPA
    verb: get
    resource: horizontalpodautoscalers
    name: web
  - type: command
    label: Read the HPA spec
    verb: describe
    resource: horizontalpodautoscalers
    name: web
  - type: quiz
    id: q1
    label: HPA
    question: The HorizontalPodAutoscaler scales…
    options:
      - replicas from metrics
      - node counts only
      - PVC size
    answer: 0
hints:
  - "List autoscalers: kubectl get hpa web"
  - "Read the target and limits: kubectl describe hpa web"
  - "Compare current utilization with the 50% CPU target."
  - "Inspect Pod usage: kubectl top pods"
solution: The HPA scales the web Deployment between two and eight replicas from 80% CPU utilization against a 50% target.
