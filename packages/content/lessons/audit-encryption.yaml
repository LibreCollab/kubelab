id: audit-encryption
unit: security
title: Audit logs and encryption at rest
xp: 20
order: 4
strict: true
prereqs: [control-plane-101, secrets-101]
theory: ./audit-encryption.md
scenario:
  nodes:
    - name: master-1
      cpu: "4"
      memory: 8Gi
  objects:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: kube-system
      status:
        phase: Active
    - apiVersion: v1
      kind: Pod
      metadata:
        name: kube-apiserver-master-1
        namespace: kube-system
      spec:
        nodeName: master-1
        containers:
          - name: kube-apiserver
            image: registry.k8s.io/kube-apiserver:v1.34.0
      status:
        phase: Running
        conditions:
          - type: Ready
            status: "True"
    - apiVersion: v1
      kind: Secret
      metadata:
        name: encryption-config
        namespace: kube-system
      type: Opaque
      data:
        encryption-config.yaml: YXBpVmVyc2lvbjogYXBpYWRtaW5pc3RyYXRpb24ua3ViZXJuZXRlcy5pby92MQ==
objectives:
  - Locate audit and encryption configuration
  - Distinguish audit from encryption
  - Verify API server flags
checks:
  - type: command
    verb: get
    resource: pods
    namespace: kube-system
    label: Found the API server
  - type: command
    verb: describe
    resource: pods
    name: kube-apiserver-master-1
    namespace: kube-system
    label: Read the API server
  - type: command
    verb: get
    resource: secrets
    name: encryption-config
    namespace: kube-system
    label: Found encryption config
  - type: quiz
    id: q1
    label: Audit purpose
    question: What do Kubernetes audit logs record?
    options:
      - API requests and policy decisions
      - Container filesystem contents
      - Node kernel messages
    answer: 0
hints:
  - "Find the API server: kubectl get pods -n kube-system"
  - "Read its flags: kubectl describe pod kube-apiserver-master-1 -n kube-system"
  - "Find the config: kubectl get secret encryption-config -n kube-system"
solution: Audit logs record API activity, while encryption configuration protects Secret data at rest in etcd.
