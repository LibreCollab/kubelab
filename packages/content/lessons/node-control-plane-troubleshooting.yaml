id: node-control-plane-troubleshooting
unit: observability
title: Node and control plane failures
xp: 20
order: 3
strict: true
prereqs: [logs-events-101, control-plane-101]
theory: ./node-control-plane-troubleshooting.md
scenario:
  nodes:
    - name: master-1
      cpu: "4"
      memory: 8Gi
    - name: node-1
      cpu: "4"
      memory: 8Gi
  objects:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: kube-system
      status:
        phase: Active
    - apiVersion: v1
      kind: Pod
      metadata:
        name: kube-apiserver-master-1
        namespace: kube-system
      spec:
        nodeName: master-1
        containers:
          - name: kube-apiserver
            image: registry.k8s.io/kube-apiserver:v1.34.0
      status:
        phase: Running
        conditions:
          - type: Ready
            status: "True"
    - apiVersion: v1
      kind: Pod
      metadata:
        name: api
        labels:
          app: api
      spec:
        nodeName: node-1
        containers:
          - name: api
            image: nginx
      status:
        phase: Running
        podIP: 10.244.1.20
        reason: CrashLoopBackOff
        logs: ["panic: database connection refused"]
    - apiVersion: v1
      kind: Event
      metadata:
        name: api-backoff
      type: Warning
      reason: BackOff
      message: Back-off restarting failed container api
      involvedObject:
        kind: Pod
        name: api
        namespace: default
objectives:
  - Separate node, control plane, and workload symptoms
  - Read component and workload events
  - Choose the next diagnostic command
checks:
  - type: command
    verb: get
    resource: pods
    namespace: kube-system
    label: Checked control plane Pods
  - type: command
    verb: logs
    name: api
    label: Read the failing logs
  - type: command
    verb: get
    resource: events
    label: Read recent events
  - type: quiz
    id: q1
    label: Failure scope
    question: A failed control plane component usually causes which symptom first?
    options:
      - API requests fail across many nodes
      - One application image becomes smaller
      - A single Pod loses its labels
    answer: 0
hints:
  - "Check control plane health: kubectl get pods -n kube-system"
  - "Read the app failure: kubectl logs api"
  - "Correlate events: kubectl get events"
  - "Inspect scheduling: kubectl describe pod api"
solution: Separate API-wide failures from node-local and workload-local symptoms before changing anything.
