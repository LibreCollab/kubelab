id: deployments-101
unit: workloads
title: Deployments and rollouts
xp: 15
order: 4
strict: true
prereqs: []
theory: ./deployments-101.md
scenario:
  nodes:
    - name: node-1
      cpu: "4"
      memory: 8Gi
  objects: []
objectives:
  - Deployment role
  - Rolling update
checks:
  - type: command
    label: Created the Deployment
    verb: create
    resource: deployments
    name: web
    image: nginx
    replicas: 3
  - type: command
    label: Scaled the Deployment
    verb: scale
    resource: deployments
    name: web
    replicas: 5
  - type: command
    label: Updated the image
    verb: set
    resource: deployments
    name: web
    container: nginx
    image: nginx:1.27
  - type: command
    label: Checked the rollout
    verb: rollout
    resource: deployments
    name: web
    action: status
  - type: deployment
    label: Deployment scaled and updated
    namespace: default
    name: web
    replicas: 5
    image: nginx:1.27
    ready: true
    labels:
      app: web
  - type: quiz
    id: q1
    label: Deployment role
    question: What does a Deployment manage?
    options:
      - ReplicaSets and Pods
      - Nodes
      - Services
    answer: 0
hints:
  - "Create it with: kubectl create deployment web --image=nginx --replicas=3"
  - "Scale it with: kubectl scale deployment web --replicas=5"
  - "Update it with: kubectl set image deployment/web nginx=nginx:1.27"
  - "Check progress with: kubectl rollout status deployment/web"
solution: create, scale, set image, and rollout status teach the Deployment workflow.
