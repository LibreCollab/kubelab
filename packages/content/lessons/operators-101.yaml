id: operators-101
unit: gitops
title: Operators and CRDs
xp: 10
order: 2
strict: true
prereqs: []
theory: ./operators-101.md
scenario:
  nodes:
    - name: node-1
      cpu: "4"
      memory: 8Gi
  objects:
    - apiVersion: example.kubelab.io/v1
      kind: Widget
      metadata:
        name: web
        labels:
          app: web
      spec:
        size: 3
        color: green
      status:
        phase: Pending
objectives:
  - Operator
checks:
  - type: command
    label: Listed Widget resources
    verb: get
    resource: widgets
  - type: command
    label: Inspected a Widget
    verb: describe
    resource: widgets
    name: web
  - type: command
    label: Observed reconciliation
    verb: get
    resource: widgets
  - type: quiz
    id: q1
    label: Operator
    question: An operator…
    options:
      - encodes operational knowledge in a controller and CRDs
      - is a kubectl plugin
      - only schedules Pods
    answer: 0
hints:
  - "List custom resources: kubectl get widgets"
  - "Inspect the resource: kubectl describe widgets web"
  - "Notice the custom spec and controller-managed status."
solution: The Widget CRD adds a new API; its controller reconciles Widget resources into Ready state.
