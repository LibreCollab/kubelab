id: pods-101
unit: fundamentals
title: Your first Pod
xp: 20
strict: true
prereqs: []
theory: ./pods-101.md
scenario:
  nodes:
    - name: node-1
      cpu: "4"
      memory: 8Gi
  objects: []
objectives:
  - Create a Pod running nginx
  - Confirm it reaches Running
checks:
  - type: pod
    name: web
    label: "Pod web exists"
  - type: pod
    name: web
    labels:
      app: web
    label: "Label app=web"
  - type: pod
    name: web
    image: nginx
    label: "Image is nginx"
  - type: pod
    name: web
    phase: Running
    label: "Phase is Running"
  - type: command
    verb: get
    resource: pods
    label: "Run kubectl get pods"
hints:
  - "Try kubectl run web --image=nginx --labels=app=web"
  - "Inspect the actual labels with kubectl get pods --show-labels"
  - "Labels are case- and value-sensitive: app=webb is not app=web"
  - "The image is checked too: use --image=nginx"
solution: kubectl run web --image=nginx --labels=app=web
