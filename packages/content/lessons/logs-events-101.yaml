id: logs-events-101
unit: observability
title: Logs and events
xp: 10
order: 1
strict: true
prereqs: []
theory: ./logs-events-101.md
scenario:
  nodes:
    - name: node-1
      cpu: "4"
      memory: 8Gi
  objects:
    - apiVersion: v1
      kind: Pod
      metadata:
        name: web
        labels:
          app: web
      spec:
        nodeName: node-1
        containers:
          - name: web
            image: nginx
      status:
        phase: Running
        podIP: 10.244.0.41
        conditions:
          - type: Ready
            status: "True"
      logs:
        - "booting web server"
        - "listening on :8080"
        - "GET /healthz 200"
    - apiVersion: v1
      kind: Event
      metadata:
        name: web-started
      type: Normal
      reason: Started
      message: Started container web
      involvedObject:
        kind: Pod
        name: web
        namespace: default
objectives:
  - Logs
  - Events
checks:
  - type: command
    label: Read the container logs
    verb: logs
    name: web
  - type: command
    label: Listed cluster events
    verb: get
    resource: events
  - type: command
    label: Inspected the Pod
    verb: describe
    resource: pods
    name: web
  - type: quiz
    id: q1
    label: Logs
    question: kubectl logs shows…
    options:
      - container stdout/stderr
      - node kernel logs
      - etcd logs by default
    answer: 0
hints:
  - "Read stdout/stderr: kubectl logs web"
  - "List recent events: kubectl get events"
  - "Combine status and events: kubectl describe pod web"
solution: Logs are container output; events explain scheduling and lifecycle changes.
