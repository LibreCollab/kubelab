id: certificates-kubeconfig
unit: architecture
title: Certificates and kubeconfig
xp: 20
order: 6
strict: true
prereqs: [kubeadm-install]
theory: ./certificates-kubeconfig.md
scenario:
  nodes:
    - name: master-1
      cpu: "4"
      memory: 8Gi
  objects:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: kube-system
      status:
        phase: Active
    - apiVersion: v1
      kind: Pod
      metadata:
        name: kube-apiserver-master-1
        namespace: kube-system
      spec:
        nodeName: master-1
        containers:
          - name: kube-apiserver
            image: registry.k8s.io/kube-apiserver:v1.34.0
      status:
        phase: Running
        conditions:
          - type: Ready
            status: "True"
objectives:
  - Map users to authentication
  - Find cluster certificate material
  - Verify API identity
checks:
  - type: command
    verb: get
    resource: nodes
    label: Reached the API
  - type: command
    verb: get
    resource: clusterroles
    label: Listed cluster roles
  - type: quiz
    id: q1
    label: kubeconfig context
    question: What does a kubeconfig context bind together?
    options:
      - Cluster, user, and namespace
      - Pod, Service, and Secret
      - Node, image, and runtime
    answer: 0
hints:
  - "Verify API access: kubectl get nodes"
  - "Inspect authorization objects: kubectl get clusterroles"
  - "The theory covers kubeconfig contexts and certificate rotation; the simulator does not execute kubeconfig commands."
solution: A kubeconfig context selects a cluster, credentials, and default namespace for kubectl requests.
