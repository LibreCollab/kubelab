id: kubeadm-install
unit: architecture
title: Cluster installation with kubeadm
xp: 20
order: 4
strict: true
prereqs: [control-plane-101]
theory: ./kubeadm-install.md
scenario:
  nodes:
    - name: master-1
      cpu: "4"
      memory: 8Gi
      labels:
        node-role.kubernetes.io/control-plane: ""
  objects:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: kube-system
      status:
        phase: Active
    - apiVersion: v1
      kind: Pod
      metadata:
        name: kube-apiserver-master-1
        namespace: kube-system
        labels:
          component: kube-apiserver
      spec:
        nodeName: master-1
        containers:
          - name: kube-apiserver
            image: registry.k8s.io/kube-apiserver:v1.34.0
      status:
        phase: Running
        podIP: 10.0.0.10
        conditions:
          - type: Ready
            status: "True"
    - apiVersion: v1
      kind: Pod
      metadata:
        name: kube-controller-manager-master-1
        namespace: kube-system
        labels:
          component: kube-controller-manager
      spec:
        nodeName: master-1
        containers:
          - name: kube-controller-manager
            image: registry.k8s.io/kube-controller-manager:v1.34.0
      status:
        phase: Running
        podIP: 10.0.0.11
        conditions:
          - type: Ready
            status: "True"
objectives:
  - Identify the packaged control plane
  - Check the cluster inventory
  - Recognise kubeadm lifecycle operations
checks:
  - type: command
    verb: get
    resource: nodes
    label: Listed the nodes
  - type: command
    verb: get
    resource: pods
    namespace: kube-system
    label: Listed control plane Pods
  - type: quiz
    id: q1
    label: kubeadm role
    question: What does kubeadm bootstrap on a new control plane node?
    options:
      - The control plane and cluster certificates
      - Only the container runtime
      - Only worker kubelets
    answer: 0
hints:
  - "Check the inventory: kubectl get nodes"
  - "Inspect packaged components: kubectl get pods -n kube-system"
  - "kubeadm init and kubeadm join are demonstrated conceptually because the simulator is single-cluster."
solution: kubeadm init creates the control plane, writes kubeconfig, and prints a join command for workers.
