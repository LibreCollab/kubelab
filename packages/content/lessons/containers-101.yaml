id: containers-101
unit: containers
title: Containers, images, and Pods
xp: 10
order: 1
strict: true
prereqs: []
theory: ./containers-101.md
scenario:
  nodes:
    - name: node-1
      cpu: "4"
      memory: 8Gi
  objects: []
objectives:
  - Image vs container
  - Run a Pod from an image
checks:
  - type: pod
    label: Running nginx Pod
    name: web
    image: nginx
    labels:
      app: web
    phase: Running
  - type: command
    label: Verified the Pod
    verb: get
    resource: pods
    name: web
  - type: quiz
    id: q1
    label: Image vs container
    question: What is the difference between an image and a container?
    options:
      - An image is the template; a container is a running instance
      - A container is stored in a registry
      - They are the same thing
    answer: 0
hints:
  - "Run it: kubectl run web --image=nginx --labels=app=web"
  - "Check it: kubectl get pod web"
solution: Run web from nginx with app=web, then verify it reaches Running.
