id: cncf-ecosystem
unit: architecture
title: The cloud native ecosystem
xp: 15
order: 7
strict: true
prereqs: [control-plane-101]
theory: ./cncf-ecosystem.md
scenario:
  nodes:
    - name: node-1
      cpu: "4"
      memory: 8Gi
  objects:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: kube-system
      status:
        phase: Active
    - apiVersion: v1
      kind: Pod
      metadata:
        name: coredns-7d9f8c6f5d-abcde
        namespace: kube-system
        labels:
          k8s-app: kube-dns
      spec:
        nodeName: node-1
        containers:
          - name: coredns
            image: registry.k8s.io/coredns/coredns:v1.12.0
      status:
        phase: Running
        conditions:
          - type: Ready
            status: "True"
    - apiVersion: v1
      kind: Pod
      metadata:
        name: metrics-server-6f7d8c9b-xyz12
        namespace: kube-system
        labels:
          k8s-app: metrics-server
      spec:
        nodeName: node-1
        containers:
          - name: metrics-server
            image: registry.k8s.io/metrics-server/metrics-server:v0.7.2
      status:
        phase: Running
        conditions:
          - type: Ready
            status: "True"
objectives:
  - Recognise CNCF project roles
  - Separate platform and workload concerns
  - Map ecosystem tools to problems
checks:
  - type: command
    verb: get
    resource: nodes
    label: Listed the cluster
  - type: command
    verb: get
    resource: pods
    namespace: kube-system
    label: Listed platform add-ons
  - type: quiz
    id: q1
    label: CNCF scope
    question: What does the CNCF host?
    options:
      - Open-source cloud native projects and community programs
      - Only commercial Kubernetes distributions
      - Only hardware certification labs
    answer: 0
hints:
  - "Inspect the cluster: kubectl get nodes"
  - "Inspect add-ons: kubectl get pods -n kube-system"
solution: The CNCF hosts projects such as Kubernetes, Prometheus, Envoy, Helm, and OpenTelemetry along with community programs.
