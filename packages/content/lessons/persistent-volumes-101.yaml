id: persistent-volumes-101
unit: storage
title: Volumes and PVCs
xp: 10
order: 1
strict: true
prereqs: []
theory: ./persistent-volumes-101.md
scenario:
  nodes:
    - name: node-1
      cpu: "4"
      memory: 8Gi
  objects:
    - apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: fast
      provisioner: kubernetes.io/no-provisioner
      reclaimPolicy: Retain
      volumeBindingMode: WaitForFirstConsumer
    - apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: data-pv
        labels:
          type: local
      spec:
        capacity:
          storage: 5Gi
        accessModes:
          - ReadWriteOnce
        storageClassName: fast
        claimRef:
          namespace: default
          name: data
        reclaimPolicy: Retain
      status:
        phase: Bound
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: fast
        volumeName: data-pv
      status:
        phase: Bound
        capacity: 5Gi
    - apiVersion: v1
      kind: Pod
      metadata:
        name: db
        labels:
          app: db
      spec:
        nodeName: node-1
        containers:
          - name: db
            image: postgres:16
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: data
      status:
        phase: Running
        podIP: 10.244.0.21
        conditions:
          - type: Ready
            status: "True"
objectives:
  - PVC meaning
  - Storage binding
checks:
  - type: command
    label: Listed the claim
    verb: get
    resource: persistentvolumeclaims
    name: data
  - type: command
    label: Inspected the binding
    verb: describe
    resource: persistentvolumeclaims
    name: data
  - type: command
    label: Found the mounted Pod
    verb: get
    resource: pods
    name: db
  - type: quiz
    id: q1
    label: PVC meaning
    question: A PersistentVolumeClaim is…
    options:
      - a request for storage
      - a node disk
      - a Secret
    answer: 0
hints:
  - "Inspect the claim: kubectl get pvc data"
  - "See its volume: kubectl describe pvc data"
  - "Find the Pod using it: kubectl get pod db -o wide"
solution: The PVC data binds to data-pv and is mounted into the db Pod.
