id: config-secret-volumes
unit: config
title: ConfigMap and Secret volumes
xp: 15
order: 3
strict: true
prereqs: [configmaps-101, secrets-101]
theory: ./config-secret-volumes.md
scenario:
  nodes:
    - name: node-1
      cpu: "4"
      memory: 8Gi
  objects:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: app-config
      data:
        MODE: production
        LOG_LEVEL: info
    - apiVersion: v1
      kind: Secret
      metadata:
        name: db-secret
      type: Opaque
      data:
        password: czNjcmV0
    - apiVersion: v1
      kind: Pod
      metadata:
        name: api
        labels:
          app: api
      spec:
        nodeName: node-1
        containers:
          - name: api
            image: nginx:1.27
            volumeMounts:
              - name: config
                mountPath: /etc/app
              - name: secret
                mountPath: /etc/db
        volumes:
          - name: config
            configMap:
              name: app-config
          - name: secret
            secret:
              secretName: db-secret
      status:
        phase: Running
        podIP: 10.244.1.31
        conditions:
          - type: Ready
            status: "True"
objectives:
  - Mount configuration as files
  - Keep Secret values out of env
  - Inspect volume wiring
checks:
  - type: command
    verb: get
    resource: configmaps
    name: app-config
    label: Found the ConfigMap
  - type: command
    verb: get
    resource: secrets
    name: db-secret
    label: Found the Secret
  - type: command
    verb: describe
    resource: pods
    name: api
    label: Read the volume mounts
  - type: quiz
    id: q1
    label: File updates
    question: When does a mounted ConfigMap volume update for a running Pod?
    options:
      - After the kubelet refresh interval
      - Only after deleting the node
      - Never, without a new image
    answer: 0
hints:
  - "Find the ConfigMap: kubectl get configmap app-config"
  - "Find the Secret: kubectl get secret db-secret"
  - "Inspect wiring: kubectl describe pod api"
solution: Projected ConfigMap and Secret volumes update on disk after the kubelet refresh interval, while subPath mounts do not.
