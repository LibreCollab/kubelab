id: cni-101
unit: networking
title: CNI and Pod networking
xp: 10
order: 1
strict: true
prereqs: []
theory: ./cni-101.md
scenario:
  nodes:
    - name: node-1
      cpu: "4"
      memory: 8Gi
    - name: node-2
      cpu: "4"
      memory: 8Gi
  objects:
    - apiVersion: v1
      kind: Pod
      metadata:
        name: web
        labels:
          app: web
      spec:
        nodeName: node-1
        containers:
          - name: web
            image: nginx
      status:
        phase: Running
        podIP: 10.244.1.10
        conditions:
          - type: Ready
            status: "True"
    - apiVersion: v1
      kind: Pod
      metadata:
        name: api
        labels:
          app: api
      spec:
        nodeName: node-2
        containers:
          - name: api
            image: nginx
      status:
        phase: Running
        podIP: 10.244.2.11
        conditions:
          - type: Ready
            status: "True"
objectives:
  - CNI role
checks:
  - type: command
    label: Found Pod IPs
    verb: get
    resource: pods
  - type: command
    label: Inspected a Pod IP
    verb: describe
    resource: pods
    name: api
  - type: quiz
    id: q1
    label: CNI role
    question: A CNI plugin provides…
    options:
      - Pod networking
      - storage classes
      - DNS records only
    answer: 0
hints:
  - "See Pods across nodes: kubectl get pods -o wide"
  - "Inspect the API Pod: kubectl describe pod api"
  - "Look at both the Pod IP and assigned node."
solution: Each Pod gets a CNI-assigned IP; node-1 and node-2 route those addresses.
