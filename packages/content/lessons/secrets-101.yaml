id: secrets-101
unit: config
title: Secrets
xp: 10
order: 2
strict: true
prereqs: []
theory: ./secrets-101.md
scenario:
  nodes:
    - name: node-1
      cpu: "4"
      memory: 8Gi
  objects: []
objectives:
  - Secret encoding
checks:
  - type: command
    label: Created the Secret
    verb: create
    resource: secrets
    name: db-secret
  - type: secret
    label: Secret contains DB_PASSWORD
    namespace: default
    name: db-secret
    keys:
      - DB_PASSWORD
  - type: command
    label: Created the Deployment
    verb: create
    resource: deployments
    name: api
    image: nginx
    replicas: 1
  - type: command
    label: Wired the Secret into env
    verb: set
    resource: deployments
    name: api
  - type: deployment
    label: Deployment is ready
    namespace: default
    name: api
    replicas: 1
    image: nginx
    ready: true
  - type: env
    label: DB_PASSWORD is injected
    namespace: default
    deployment: api
    name: DB_PASSWORD
    value: s3cr3t
    sourceKind: Secret
    sourceName: db-secret
  - type: quiz
    id: q1
    label: Secret encoding
    question: Secrets in Kubernetes are…
    options:
      - base64-encoded, not encrypted by default
      - encrypted everywhere by default
      - only for SSH keys
    answer: 0
hints:
  - "Create it: kubectl create secret generic db-secret --from-literal=DB_PASSWORD=s3cr3t"
  - "Create the workload: kubectl create deployment api --image=nginx --replicas=1"
  - "Wire it: kubectl set env deployment/api --from=secret/db-secret"
  - "Inspect it: kubectl describe deployment api"
solution: The Secret is base64-encoded at rest and resolves into the container environment.
