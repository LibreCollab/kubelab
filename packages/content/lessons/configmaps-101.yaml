id: configmaps-101
unit: config
title: ConfigMaps
xp: 10
order: 1
strict: true
prereqs: []
theory: ./configmaps-101.md
scenario:
  nodes:
    - name: node-1
      cpu: "4"
      memory: 8Gi
  objects: []
objectives:
  - ConfigMap purpose
checks:
  - type: command
    label: Created the ConfigMap
    verb: create
    resource: configmaps
    name: app-config
  - type: configmap
    label: ConfigMap has app settings
    namespace: default
    name: app-config
    data:
      APP_MODE: production
      LOG_LEVEL: debug
  - type: command
    label: Created the Deployment
    verb: create
    resource: deployments
    name: web
    image: nginx
    replicas: 2
  - type: command
    label: Wired the ConfigMap into env
    verb: set
    resource: deployments
    name: web
  - type: deployment
    label: Deployment is ready
    namespace: default
    name: web
    replicas: 2
    image: nginx
    ready: true
  - type: env
    label: APP_MODE is injected
    namespace: default
    deployment: web
    name: APP_MODE
    value: production
    sourceKind: ConfigMap
    sourceName: app-config
  - type: env
    label: LOG_LEVEL is injected
    namespace: default
    deployment: web
    name: LOG_LEVEL
    value: debug
    sourceKind: ConfigMap
    sourceName: app-config
  - type: quiz
    id: q1
    label: ConfigMap purpose
    question: ConfigMaps store…
    options:
      - non-secret configuration
      - passwords only
      - container images
    answer: 0
hints:
  - "Create it: kubectl create configmap app-config --from-literal=APP_MODE=production --from-literal=LOG_LEVEL=debug"
  - "Create the workload: kubectl create deployment web --image=nginx --replicas=2"
  - "Wire it: kubectl set env deployment/web --from=configmap/app-config"
  - "Inspect it: kubectl describe deployment web"
solution: envFrom resolves every key in app-config into the Deployment's containers.
