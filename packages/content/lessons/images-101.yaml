id: images-101
unit: containers
title: Images, tags, and registries
xp: 10
order: 2
strict: true
prereqs: []
theory: ./images-101.md
scenario:
  nodes:
    - name: node-1
      cpu: "4"
      memory: 8Gi
  objects: []
objectives:
  - Reproducible image
checks:
  - type: command
    label: Ran a tagged image
    verb: run
    name: web
    image: nginx:1.27
  - type: command
    label: Checked the image in the Pod
    verb: describe
    resource: pods
    name: web
  - type: quiz
    id: q1
    label: Reproducible image
    question: Which image reference is the most reproducible?
    options:
      - nginx@sha256:…
      - nginx:latest
      - nginx
    answer: 0
hints:
  - "Run a pinned image: kubectl run web --image=nginx:1.27"
  - "Inspect it: kubectl describe pod web"
  - "Compare mutable latest tags with digests."
solution: A digest is the most reproducible reference; a version tag is the next best lesson default.
