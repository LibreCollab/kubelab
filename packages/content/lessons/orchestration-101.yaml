  - type: quiz
    id: q1
    label: Desired state
    question: What is Kubernetes' core operating model?
    options:
      - Declare desired state; controllers reconcile
      - Run docker run on every node manually
      - Treat YAML as documentation only
    answer: 0
hints:
  - "Declare it: kubectl create deployment web --image=nginx --replicas=3"
  - "Watch it reconcile: kubectl get pods -o wide"
  - "Change desired state: kubectl scale deployment web --replicas=5"
solution: Controllers continuously reconcile actual state toward desired state.
